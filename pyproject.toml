[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relaytv"
version = "0.8.0"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
  # Jellyfin control socket. It already arrives via uvicorn[standard], but the
  # cast target is a product feature and must not depend on another package's
  # extra continuing to pull it in.
  "websockets>=13,<17",
  "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.4",
]
qt = [
  "PySide6>=6.7",
]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "native: native Qt product-default coverage",
  "legacy: compatibility / deprecated runtime coverage",
]

[tool.ruff]
line-length = 100

target-version = "py312"

# Pin the rule set explicitly. It was previously inherited from whichever ruff
# version CI resolved, so ruff 0.16.0 widening its defaults turned a green tree
# into 1397 findings without a line of code changing. These four are the set the
# tree has always been linted against; adopting more is a deliberate decision,
# not a side effect of a linter release.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

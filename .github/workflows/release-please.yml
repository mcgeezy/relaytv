name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update release pull request, or create draft release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set image creation time
        id: created
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            RELAYTV_IMAGE_SOURCE=https://github.com/${{ github.repository }}
            RELAYTV_IMAGE_REVISION=${{ needs.release-please.outputs.sha }}
            RELAYTV_IMAGE_VERSION=${{ needs.release-please.outputs.tag_name }}
            RELAYTV_IMAGE_CREATED=${{ steps.created.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add product overview to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELAYTV_RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -eu
          release_notes_dir="$(mktemp -d)"
          trap 'rm -rf "$release_notes_dir"' EXIT
          existing_notes="$release_notes_dir/existing.md"
          updated_notes="$release_notes_dir/updated.md"
          marker='<!-- relaytv-release-overview -->'
          hero_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RELAYTV_RELEASE_TAG}/docs/images/readme/hero.png"

          gh release view "$RELAYTV_RELEASE_TAG" --json body --jq '.body' > "$existing_notes"
          if grep -Fq "$marker" "$existing_notes"; then
            exit 0
          fi

          {
            printf '%s\n\n' "$marker"
            printf '[![RelayTV on phone and TV](%s)](https://github.com/%s#readme)\n\n' "$hero_url" "$GITHUB_REPOSITORY"
            printf '## Your media. Your TV. Your rules.\n\n'
            printf 'RelayTV turns the Linux device connected to your display into a local-first playback target you can control from your phone, media library, Home Assistant, scripts, and companion apps. This release brings the modern RelayTV experience together across the remote, Jellyfin and Emby browsing, the idle screen, and the project home page.\n\n'
            printf -- '---\n\n'
            cat "$existing_notes"
          } > "$updated_notes"

          gh release edit "$RELAYTV_RELEASE_TAG" --notes-file "$updated_notes"

      - name: Publish GitHub Release after image push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pip install -e '.[dev]'
      - run: ruff check app tests
      - run: node --check app/relaytv_app/static/ui/realtime_transport.js
      - run: node --check app/relaytv_app/static/ui/app.js
      - name: Check generated X11 overlay JavaScript
        run: >-
          PYTHONPATH=app python3 -c
          "import re; from relaytv_app.routes import x11_overlay_page;
          print(re.findall(r'<script>(.*?)</script>',
          x11_overlay_page().body.decode(), re.S)[0])"
          | node --check -
      - run: node --test tests/js/*.test.js
      - run: pytest -q

  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref_name == 'main' }}
          load: false
          tags: ghcr.io/${{ github.repository }}:main
          build-args: |
            RELAYTV_IMAGE_SOURCE=https://github.com/${{ github.repository }}
            RELAYTV_IMAGE_REVISION=${{ github.sha }}
            RELAYTV_IMAGE_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

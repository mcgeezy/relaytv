services:
  relaytv:
    user: "${PUID:-1000}:${PGID:-1000}"
    image: "${RELAYTV_IMAGE_REF:-ghcr.io/mcgeezy/relaytv:latest}"
    pull_policy: "${RELAYTV_PULL_POLICY:-missing}"
    container_name: relaytv
    network_mode: host
    shm_size: "512m"

    restart: unless-stopped
    env_file:
      - .env

    environment:
      # Optional display/session passthrough (leave unset for headless runtime).
      - QT_X11_NO_MITSHM=1
      - DISPLAY=${DISPLAY-}
      - XDG_SESSION_TYPE=${RELAYTV_HOST_SESSION_TYPE:-${XDG_SESSION_TYPE-}}
      - RELAYTV_HOST_SESSION_TYPE=${RELAYTV_HOST_SESSION_TYPE:-${XDG_SESSION_TYPE-}}
      - RELAYTV_MODE=${RELAYTV_MODE:-}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/${PUID:-1000}}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY-}
      - QT_QPA_PLATFORM=${QT_QPA_PLATFORM-}

      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - XDG_CONFIG_HOME=/tmp/.config

    tmpfs:
      - /tmp

    volumes:
      - ./data:/data
      - ./bin:/opt/relaytv/bin:rw

    working_dir: /app

    # Host integration mounts and device passthrough (/dev/snd, /dev/dri, Pi
    # codec nodes, CEC, desktop sockets) live
    # in docker-compose.override.yml, generated by scripts/install.sh from the
    # devices the host actually exposes. A device mapped here that the host
    # lacks makes compose refuse to create the container (headless/no-KMS
    # hosts), and overrides can only add devices, never remove them.
    group_add:
      - audio
      - video
      - "${RELAYTV_RENDER_GID:-992}"

    security_opt:
      - apparmor:unconfined

    tty: true
    stdin_open: true

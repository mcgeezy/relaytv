# Local-only, gitignored. Runs the checkout's app code inside the released
# image: the image copies only app/relaytv_app and installs every dependency
# system-wide, so this needs no rebuild.
services:
  relaytv:
    volumes:
      - type: bind
        source: /opt/dev/relaytv/app/relaytv_app
        target: /app/relaytv_app
        read_only: true
